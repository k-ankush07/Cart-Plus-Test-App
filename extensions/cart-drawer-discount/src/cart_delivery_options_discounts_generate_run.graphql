query DeliveryInput {
  cart {
    deliveryGroups {
      id
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
    buyerIdentity {
      isAuthenticated
      customer {
        id
      }
    }
    attribute(key: "_cart_has_subscription") {
      value
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:cart-plus-discount", key: "config") {
      value
    }
  }
}
