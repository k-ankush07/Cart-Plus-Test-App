# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "777e08bc2cc25f680c35f7e5dbf9779c"
name = "Cart Plus"
application_url = "https://hubsyntax.online"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/orders/paid"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[access_scopes]
scopes = "read_customers,read_discounts,read_locations,read_orders,read_pixels,read_products,read_publications,read_shipping,read_themes,write_app_proxy,write_discounts,write_files,write_orders,write_products,write_publications,write_themes"

[auth]
redirect_urls = [
  "https://hubsyntax.online/api/auth"
]

[app_proxy]
url = "https://hubsyntax.online/api/proxy-order-track"
subpath = "hub-track"
prefix = "apps"