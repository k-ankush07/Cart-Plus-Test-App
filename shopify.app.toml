# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "777e08bc2cc25f680c35f7e5dbf9779c"
name = "Cart Plus"
application_url = "https://coming-eagles-sms-explaining.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

 [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_discounts,read_locations,read_orders,read_pixels,read_products,read_publications,read_shipping,read_themes,write_app_proxy,write_discounts,write_files,write_orders,write_products,write_publications,write_themes"

[auth]
redirect_urls = [
  "https://coming-eagles-sms-explaining.trycloudflare.com/api/auth"
]

[app_proxy]
url = "https://coming-eagles-sms-explaining.trycloudflare.com/api/proxy-order-track"
subpath = "hub-track"
prefix = "apps"
