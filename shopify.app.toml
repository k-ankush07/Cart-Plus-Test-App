# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0741db22a559208f286f8afcfb6dcc65"
name = "Cart Drawer"
application_url = "https://hubsyntax.online"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

[app_proxy]
url = "https://hubsyntax.online/api/proxy-order-track"
subpath = "hub-track"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_discounts,read_orders,write_orders,read_products,read_publications,read_themes,write_app_proxy,write_discounts,write_files,write_products,write_publications,write_themes,read_pixels,read_shipping,read_locations"

[auth]
redirect_urls = [ "https://hubsyntax.online/api/auth" ]
